name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift test
      - name: Build app archive
        run: |
          VERSION="${GITHUB_REF_NAME#v}" ./build-app.sh
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Parcelite-*-macOS.zip
          draft: false
          prerelease: false
