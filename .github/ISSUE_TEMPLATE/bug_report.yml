name: Bug report
description: Report a reproducible problem in Parcelite.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Parcelite
        2. Add tracking number ...
        3. Click ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Parcelite version
      placeholder: 0.1.0
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: macOS 15.5
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove tracking numbers and API tokens before posting.
